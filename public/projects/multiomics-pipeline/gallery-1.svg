<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Pipeline stages schematic">
  <rect width="1200" height="750" fill="#0b1620"/>
  <text x="120" y="80" fill="#e8f0f7" font-family="Georgia, serif" font-size="32">Pipeline stages</text>
  <g font-family="sans-serif" font-size="22" fill="#e8f0f7">
    <rect x="120" y="280" width="200" height="120" rx="16" fill="#101f2e" stroke="#3dd6c3"/>
    <text x="220" y="350" text-anchor="middle">Ingest</text>
    <rect x="400" y="280" width="200" height="120" rx="16" fill="#101f2e" stroke="#60a5fa"/>
    <text x="500" y="350" text-anchor="middle">Normalize</text>
    <rect x="680" y="280" width="200" height="120" rx="16" fill="#101f2e" stroke="#3dd6c3"/>
    <text x="780" y="350" text-anchor="middle">Integrate</text>
