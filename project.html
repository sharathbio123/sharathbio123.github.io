<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title id="project-doc-title">Project | Sharath B S</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#060d14" />
    <link rel="canonical" href="https://sharathbio123.github.io/project.html" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.4.2/3Dmol-min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.4.2/3Dmol.ui-min.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" id="top">
      <nav class="nav container" aria-label="Primary">
        <a class="nav-logo" href="/">SBS</a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
          <span class="sr-only">Toggle navigation</span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
        <ul class="nav-menu" id="nav-menu">
          <li><a href="/#about">About</a></li>
          <li><a href="/#research">Research</a></li>
          <li><a href="/#interests">Interests</a></li>
          <li><a href="/#projects">Projects</a></li>
          <li>
            <a href="/CV.pdf" target="_blank" rel="noopener noreferrer">CV</a>
          </li>
          <li><a href="/#connect">Connect</a></li>
        </ul>
      </nav>
    </header>

    <main id="main">
      <div id="project-root">
        <section class="section">
          <div class="container">
            <p class="section-lead">Loading project…</p>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>&copy; <span id="year"></span> Sharath B S. All rights reserved.</p>
        <a href="#top">Back to top</a>
      </div>
    </footer>

    <script type="module" src="/src/project-page.js"></script>
    <script type="module">
      const navToggle = document.querySelector('.nav-toggle');
      const navMenu = document.querySelector('.nav-menu');
      const yearEl = document.querySelector('#year');

      if (yearEl) yearEl.textContent = String(new Date().getFullYear());

      if (navToggle && navMenu) {
        navToggle.addEventListener('click', () => {
          const isOpen = navMenu.classList.toggle('is-open');
          navToggle.setAttribute('aria-expanded', String(isOpen));
        });
        navMenu.querySelectorAll('a').forEach((link) => {
          link.addEventListener('click', () => {
            navMenu.classList.remove('is-open');
            navToggle.setAttribute('aria-expanded', 'false');
          });
        });
      }
    </script>
  </body>
</html>
